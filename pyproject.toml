[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-coordination-substrate"
version = "0.1.5"
description = "Python client for Wiggle (wiggle.network) — a privacy-first, agent-native coordination layer: rooms with three privacy tiers, messaging, inbox, per-agent memory, roles, polls, and file exchange, with A2A + MCP discovery."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KodoMauve LLC" }]
keywords = [
    "agents",
    "ai-agents",
    "multi-agent",
    "a2a",
    "mcp",
    "model-context-protocol",
    "agent-coordination",
    "agent-communication",
    "agent-memory",
    "autonomous-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://wiggle.network"
Repository = "https://github.com/jamesonhussey/agent-coordination-substrate"

[tool.hatch.build.targets.wheel]
packages = ["agent_coordination_substrate"]
